name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: |
          echo "VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)" >> $GITHUB_ENV
          echo "VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -PEXPEMEMO_TOKEN="${{ secrets.EXPEMEMO_TOKEN }}"

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/expememo.keystore
          BT=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          ${BT}/apksigner sign \
            --ks /tmp/expememo.keystore \
            --ks-key-alias expememo \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out ExpeMemo-v${VN}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          ${BT}/apksigner verify ExpeMemo-v${VN}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expememo-apk
          path: ExpeMemo-v${VN}.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VN}-${VC}" \
            "ExpeMemo-v${VN}.apk#ExpeMemo-v${VN}.apk" \
            --title "v${VN}" \
            --notes "versionCode: ${VC}" \
            || gh release upload "v${VN}-${VC}" \
            "ExpeMemo-v${VN}.apk#ExpeMemo-v${VN}.apk" --clobber
