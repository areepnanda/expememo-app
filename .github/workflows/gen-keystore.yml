name: Generate keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore expememo.keystore \
            -alias expememo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=ExpeMemo, OU=Personal, O=Personal, L=Depok, ST=JawaBarat, C=ID"
          base64 -w0 expememo.keystore > expememo.keystore.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: expememo-keystore
          path: expememo.keystore.b64
          retention-days: 1
